<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Competition PnL Chart</title>
	<style>
		@font-face {
			font-family: 'Akira Expanded';
			src: url('./akira_expanded/Akira%20Expanded%20Demo.otf') format('opentype');
			font-display: swap;
		}

		:root {
			--text: rgba(255, 255, 255, 0.9);
			--muted: rgba(255, 255, 255, 0.42);
			--grid: rgba(255, 255, 255, 0.1);
			--axis: rgba(255, 255, 255, 0.16);
			--panel: rgba(22, 25, 29, 0.78);
			--panel-border: rgba(255, 255, 255, 0.08);
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			/* background: transparent; */
			background: rgb(31, 31, 31);
			overflow: hidden;
			font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
		}

		body {
			position: relative;
			color: var(--text);
		}

		canvas {
			display: block;
			width: 100vw;
			height: 100vh;
		}
	</style>
</head>

<body>
	<canvas id="chart" aria-label="Competition pnl chart overlay"></canvas>

	<script>
		(() => {
			const WINDOW_MS = 30 * 60 * 1000;
			const X_AXIS_LOOKAHEAD_MS = 5 * 60 * 1000;
			const RENDER_DELAY_MS = 2 * 1000;
			const Y_RANGE_HALF_LIFE_MS = 220;
			const FALLBACK_COLORS = ['#ff8a1f', '#4ade80', '#e879f9', '#22d3ee', '#60a5fa', '#f97316', '#fde047', '#7c3aed'];
			const canvas = document.getElementById('chart');
			const ctx = canvas.getContext('2d');
			const LABEL_FONT = '12px "Akira Expanded", sans-serif';

			let socket = null;
			let reconnectDelay = 1000;
			let reconnectTimer = null;
			let latestPayload = null;
			let playheadTs = null;
			let displayedYMin = null;
			let displayedYMax = null;
			let lastFrameAt = null;
			let lastCanvasWidth = 0;
			let lastCanvasHeight = 0;
			let lastCanvasDpr = 0;

			const timeFormatter = new Intl.DateTimeFormat(undefined, {
				hour: 'numeric',
				minute: '2-digit',
			});

			function getWsUrl() {
				const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
				return `${protocol}//${window.location.host}/ws-pnl-chart`;
			}

			function connect() {
				if (reconnectTimer !== null) {
					window.clearTimeout(reconnectTimer);
					reconnectTimer = null;
				}
				socket = new WebSocket(getWsUrl());

				socket.addEventListener('open', () => {
					reconnectDelay = 1000;
				});

				socket.addEventListener('message', (event) => {
					let message;
					try {
						message = JSON.parse(event.data);
					} catch (error) {
						console.error('[pnl-chart] Failed to parse message', error);
						return;
					}

					if (message.type === 'pnl_chart') {
						latestPayload = message.payload;
					}
				});

				socket.addEventListener('close', () => {
					scheduleReconnect();
				});

				socket.addEventListener('error', () => {
					if (socket && socket.readyState !== WebSocket.CLOSED) {
						socket.close();
					}
				});
			}

			function scheduleReconnect() {
				reconnectTimer = window.setTimeout(() => {
					reconnectDelay = Math.min(reconnectDelay * 2, 30000);
					connect();
				}, reconnectDelay);
			}

			function resizeCanvasIfNeeded() {
				const dpr = window.devicePixelRatio || 1;
				const width = Math.max(1, window.innerWidth);
				const height = Math.max(1, window.innerHeight);
				if (width === lastCanvasWidth && height === lastCanvasHeight && dpr === lastCanvasDpr) {
					return;
				}

				canvas.width = Math.round(width * dpr);
				canvas.height = Math.round(height * dpr);
				canvas.style.width = `${width}px`;
				canvas.style.height = `${height}px`;
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				lastCanvasWidth = width;
				lastCanvasHeight = height;
				lastCanvasDpr = dpr;
			}

			function renderFrame(frameAt) {
				const frameDeltaMs = lastFrameAt === null ? 0 : frameAt - lastFrameAt;
				lastFrameAt = frameAt;
				render(frameDeltaMs);
				window.requestAnimationFrame(renderFrame);
			}

			function render(frameDeltaMs) {
				resizeCanvasIfNeeded();
				ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

				const prepared = prepareChartData(latestPayload, frameDeltaMs);
				if (prepared === null) {
					drawEmptyState();
					return;
				}

				const layout = getLayout(canvas.clientWidth, canvas.clientHeight, prepared);
				drawGrid(layout, prepared);
				drawSeries(layout, prepared);
				drawSeriesLabels(layout, prepared);
			}

			function drawEmptyState() {
				return;
			}

			function prepareChartData(payload, frameDeltaMs) {
				if (!payload || !payload.leaderboard || !payload.pnl) {
					playheadTs = null;
					displayedYMin = null;
					displayedYMax = null;
					return null;
				}

				const traders = Array.isArray(payload.leaderboard.traders) ? payload.leaderboard.traders : [];
				const visibleTraders = traders.filter((trader) => trader && trader.is_eliminated !== true);
				const seriesList = [];
				for (const trader of visibleTraders) {
					const pnlTrader = payload.pnl.traders?.[trader.user_id];
					if (!pnlTrader || !Array.isArray(pnlTrader.series) || pnlTrader.series.length === 0) {
						continue;
					}
					seriesList.push({
						userId: trader.user_id,
						username: trader.username,
						color: pnlTrader.color || FALLBACK_COLORS[seriesList.length % FALLBACK_COLORS.length],
						series: pnlTrader.series.slice().sort((left, right) => left.ts - right.ts),
					});
				}

				if (seriesList.length === 0) {
					return null;
				}

				const windowStart = Math.min(...seriesList.map((item) => item.series[0].ts));
				const maxWindowEnd = windowStart + WINDOW_MS;
				const filteredSeries = seriesList
					.map((item) => ({
						...item,
						points: item.series.filter((point) => point.ts >= windowStart && point.ts <= maxWindowEnd),
					}))
					.filter((item) => item.points.length > 0);

				if (filteredSeries.length === 0) {
					playheadTs = null;
					return null;
				}

				const latestKnownTs = Math.max(...filteredSeries.map((item) => item.points[item.points.length - 1].ts));
				const displayedWindowEnd = Math.min(maxWindowEnd, latestKnownTs + X_AXIS_LOOKAHEAD_MS);
				const targetPlayheadTs = Math.max(windowStart, Math.min(maxWindowEnd, latestKnownTs - RENDER_DELAY_MS));

				if (playheadTs === null || playheadTs < windowStart || playheadTs > maxWindowEnd || playheadTs > latestKnownTs) {
					playheadTs = targetPlayheadTs;
				} else {
					playheadTs = Math.min(playheadTs + frameDeltaMs, targetPlayheadTs);
				}

				const animatedSeries = filteredSeries
					.map((item) => ({
						...item,
						points: getAnimatedSeriesPoints(item.points, playheadTs),
					}))
					.filter((item) => item.points.length > 0);

				if (animatedSeries.length === 0) {
					return null;
				}

				const pnlValues = filteredSeries.flatMap((item) => item.points.map((point) => point.pnl_pct));
				let targetYMin = Math.min(0, ...pnlValues);
				let targetYMax = Math.max(0, ...pnlValues);
				if (targetYMin === targetYMax) {
					targetYMin -= 1;
					targetYMax += 1;
				} else {
					const padding = Math.max((targetYMax - targetYMin) * 0.12, 0.8);
					targetYMin -= padding;
					targetYMax += padding;
				}

				if (displayedYMin === null || displayedYMax === null || frameDeltaMs <= 0) {
					displayedYMin = targetYMin;
					displayedYMax = targetYMax;
				} else {
					const smoothing = 1 - Math.pow(0.5, frameDeltaMs / Y_RANGE_HALF_LIFE_MS);
					displayedYMin += (targetYMin - displayedYMin) * smoothing;
					displayedYMax += (targetYMax - displayedYMax) * smoothing;
				}

				return {
					series: animatedSeries,
					windowStart,
					windowEnd: displayedWindowEnd,
					playheadTs,
					yMin: displayedYMin,
					yMax: displayedYMax,
				};
			}

			function getAnimatedSeriesPoints(points, playbackTs) {
				if (!Array.isArray(points) || points.length === 0) {
					return [];
				}

				if (playbackTs <= points[0].ts) {
					return points[0].ts === playbackTs ? [points[0]] : [];
				}

				const animatedPoints = [];
				let previousPoint = null;

				for (const point of points) {
					if (point.ts <= playbackTs) {
						animatedPoints.push(point);
						previousPoint = point;
						continue;
					}

					if (previousPoint !== null && previousPoint.ts < playbackTs) {
						animatedPoints.push(interpolateSeriesPoint(previousPoint, point, playbackTs));
					}

					break;
				}

				return animatedPoints;
			}

			function interpolateSeriesPoint(previousPoint, nextPoint, targetTs) {
				const span = nextPoint.ts - previousPoint.ts;
				if (span <= 0) {
					return previousPoint;
				}

				const ratio = (targetTs - previousPoint.ts) / span;
				return {
					ts: targetTs,
					equity: previousPoint.equity + (nextPoint.equity - previousPoint.equity) * ratio,
					pnl_pct: previousPoint.pnl_pct + (nextPoint.pnl_pct - previousPoint.pnl_pct) * ratio,
				};
			}

			function getLabelGutterWidth(prepared) {
				if (!prepared || !Array.isArray(prepared.series) || prepared.series.length === 0) {
					return 160;
				}

				ctx.save();
				ctx.font = LABEL_FONT;
				const widestLabel = prepared.series.reduce((maxWidth, item) => {
					const label = String(item.username || '').toUpperCase();
					return Math.max(maxWidth, ctx.measureText(label).width);
				}, 0);
				ctx.restore();

				return Math.max(160, widestLabel + 28);
			}

			function getLayout(width, height, prepared) {
				const left = Math.max(88, width * 0.075);
				const right = Math.max(getLabelGutterWidth(prepared), width * 0.18);
				const top = Math.max(28, height * 0.06);
				const bottom = Math.max(56, height * 0.12);
				return {
					left,
					right,
					top,
					bottom,
					plotLeft: left,
					plotRight: width - right,
					plotTop: top,
					plotBottom: height - bottom,
					plotWidth: Math.max(1, width - left - right),
					plotHeight: Math.max(1, height - top - bottom),
				};
			}

			function drawGrid(layout, prepared) {
				ctx.save();
				ctx.strokeStyle = 'rgba(255,255,255,0.5)';
				ctx.lineWidth = 2;
				ctx.fillStyle = 'rgba(255,255,255,0.5)';
				ctx.font = '500 12px Segoe UI, sans-serif';
				ctx.textAlign = 'right';
				ctx.textBaseline = 'middle';

				const yTicks = getYTicks(prepared.yMin, prepared.yMax, 6);
				for (const tick of yTicks) {
					const y = toY(tick, layout, prepared);
					const labelY = getClampedYTickLabelY(y);
					if (Math.abs(tick) < 0.0001) {
						ctx.setLineDash([4, 8]);
						ctx.beginPath();
						ctx.moveTo(layout.plotLeft, y);
						ctx.lineTo(layout.plotRight, y);
						ctx.stroke();
						ctx.setLineDash([]);
					}
					ctx.fillText(`${tick.toFixed(1)}%`, layout.plotLeft - 14, labelY);
				}

				ctx.textAlign = 'center';
				ctx.textBaseline = 'top';
				const xTickCount = 7;
				for (let i = 0; i < xTickCount; i += 1) {
					const ratio = xTickCount === 1 ? 0 : i / (xTickCount - 1);
					const ts = prepared.windowStart + ratio * (prepared.windowEnd - prepared.windowStart);
					const x = layout.plotLeft + ratio * layout.plotWidth;
					ctx.fillText(formatTime(ts), x, layout.plotBottom + 14);
				}

				ctx.restore();
			}

			function getClampedYTickLabelY(y) {
				const metrics = ctx.measureText('100.0%');
				const ascent = metrics.actualBoundingBoxAscent || 6;
				const descent = metrics.actualBoundingBoxDescent || 6;
				const minY = ascent * 2;
				const maxY = canvas.clientHeight - descent * 2;
				return Math.min(maxY, Math.max(minY, y));
			}

			function drawSeries(layout, prepared) {
				ctx.save();
				const clipInset = 12;
				ctx.beginPath();
				ctx.rect(
					layout.plotLeft - clipInset,
					layout.plotTop - clipInset,
					layout.plotWidth + clipInset * 2,
					layout.plotHeight + clipInset * 2
				);
				ctx.clip();

				for (const item of prepared.series) {
					const points = item.points.map((point) => ({
						x: toX(point.ts, layout, prepared),
						y: toY(point.pnl_pct, layout, prepared),
						data: point,
					}));

					if (points.length === 1) {
						drawPoint(points[0].x, points[0].y, item.color, 6);
						continue;
					}

					ctx.lineCap = 'round';
					ctx.lineJoin = 'round';
					ctx.strokeStyle = item.color;
					ctx.lineWidth = 1.5;
					ctx.beginPath();
					ctx.moveTo(points[0].x, points[0].y);
					for (let i = 1; i < points.length; i += 1) {
						ctx.lineTo(points[i].x, points[i].y);
					}
					ctx.stroke();

					const lastPoint = points[points.length - 1];
					drawPoint(lastPoint.x, lastPoint.y, item.color, 7);
					item.renderedLastPoint = lastPoint;
				}

				ctx.restore();
			}

			function drawSeriesLabels(layout, prepared) {
				const labels = prepared.series
					.map((item) => {
						if (!item.renderedLastPoint) {
							return null;
						}
						return {
							color: item.color,
							text: String(item.username || '').toUpperCase(),
							pointX: item.renderedLastPoint.x,
							pointY: item.renderedLastPoint.y,
							pointRadius: item.points.length === 1 ? 6 : 7,
							targetY: item.renderedLastPoint.y,
						};
					})
					.filter(Boolean)
					.sort((left, right) => left.targetY - right.targetY);

				if (labels.length === 0) {
					return;
				}

				const labelHeight = 30;
				const gap = 10;
				const topBound = layout.plotTop + labelHeight / 2;
				const bottomBound = layout.plotBottom - labelHeight / 2;

				for (let i = 0; i < labels.length; i += 1) {
					const previous = labels[i - 1];
					const minY = previous ? previous.targetY + labelHeight + gap : topBound;
					labels[i].targetY = Math.max(labels[i].targetY, minY);
				}

				for (let i = labels.length - 1; i >= 0; i -= 1) {
					const next = labels[i + 1];
					const maxY = next ? next.targetY - (labelHeight + gap) : bottomBound;
					labels[i].targetY = Math.min(labels[i].targetY, maxY);
				}

				const labelOffsetX = 30;
				const maxLabelRight = canvas.clientWidth - 16;
				ctx.save();
				ctx.font = LABEL_FONT;
				ctx.fillStyle = 'rgba(255,255,255,0.92)';
				ctx.textBaseline = 'middle';
				ctx.textAlign = 'left';
				for (const label of labels) {
					const textWidth = ctx.measureText(label.text).width;
					const desiredTextX = label.pointX + labelOffsetX;
					label.textX = Math.min(desiredTextX, maxLabelRight - textWidth);
					ctx.save();
					ctx.strokeStyle = label.color;
					ctx.globalAlpha = 0.65;
					ctx.lineWidth = 1;
					ctx.setLineDash([4, 4]);
					ctx.beginPath();
					ctx.moveTo(label.pointX, label.pointY);
					ctx.lineTo(label.textX - 8, label.targetY);
					ctx.stroke();
					ctx.restore();
					ctx.fillStyle = label.color;
					ctx.fillText(label.text, label.textX, label.targetY + 0.5);
				}

				const dotsByDepth = [...labels].sort((left, right) => right.pointY - left.pointY);
				for (const label of dotsByDepth) {
					drawPoint(label.pointX, label.pointY, label.color, label.pointRadius);
				}
				ctx.restore();
			}

			function drawPoint(x, y, color, radius) {
				ctx.save();
				ctx.beginPath();
				ctx.arc(x, y, radius + 0.5, 0, Math.PI * 2);
				ctx.lineWidth = 3;
				ctx.strokeStyle = color;
				ctx.stroke();
				ctx.shadowColor = 'rgba(255, 255, 255, 0.45)';
				ctx.shadowBlur = 8;
				ctx.fillStyle = '#ffffff';
				ctx.beginPath();
				ctx.arc(x, y, radius, 0, Math.PI * 2);
				ctx.fill();
				ctx.restore();
			}

			function toX(ts, layout, prepared) {
				const span = prepared.windowEnd - prepared.windowStart || 1;
				return layout.plotLeft + ((ts - prepared.windowStart) / span) * layout.plotWidth;
			}

			function toY(value, layout, prepared) {
				const range = prepared.yMax - prepared.yMin || 1;
				const ratio = (value - prepared.yMin) / range;
				return layout.plotBottom - ratio * layout.plotHeight;
			}

			function niceStep(min, max, count) {
				const rough = Math.abs(max - min) / Math.max(1, count);
				const power = Math.pow(10, Math.floor(Math.log10(rough || 1)));
				const fraction = rough / power;
				if (fraction <= 1) return power;
				if (fraction <= 2) return 2 * power;
				if (fraction <= 5) return 5 * power;
				return 10 * power;
			}

			function getYTicks(min, max, count) {
				const step = niceStep(min, max, count);
				const start = Math.ceil(min / step) * step;
				const ticks = [];
				for (let value = start; value <= max + step * 0.5; value += step) {
					ticks.push(Number(value.toFixed(6)));
				}
				return ticks;
			}

			function formatTime(ts) {
				return timeFormatter.format(new Date(ts)).replace(' ', '');
			}

			window.addEventListener('resize', () => {
				lastCanvasWidth = 0;
			});
			if (document.fonts && document.fonts.load) {
				document.fonts.load(LABEL_FONT).then(() => {
					lastCanvasWidth = 0;
				});
			}
			connect();
			window.requestAnimationFrame(renderFrame);
		})();
	</script>
</body>

</html>
