<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Competition Admin</title>
	<style>
		:root {
			--bg: #101214;
			--panel: #171a1d;
			--panel-soft: #1e2328;
			--card: #161a1f;
			--card-border: #2a3138;
			--text: #ecf0f3;
			--muted: #99a3ad;
			--accent: #7fb3ff;
			--positive: #58d68d;
			--negative: #ff7b72;
			--shadow: none;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
			color: var(--text);
			background: var(--bg);
		}

		.shell {
			width: min(1200px, calc(100vw - 32px));
			margin: 0 auto;
			padding: 32px 0 48px;
		}

		.toolbar {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 12px;
			margin-bottom: 24px;
			padding: 14px 16px;
			border: 1px solid var(--card-border);
			border-radius: 10px;
			background: var(--panel);
		}

		.toolbar-links {
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
		}

		.toolbar-actions {
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
		}

		.toolbar-action-group {
			display: inline-flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 12px;
		}

		.toolbar-action-group+.toolbar-action-group {
			padding-left: 16px;
			margin-left: 4px;
			border-left: 1px solid rgba(255, 255, 255, 0.22);
		}

		.toolbar-actions label {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			color: var(--muted);
			font-size: 13px;
		}

		.toolbar-actions input[type="number"] {
			width: 84px;
			padding: 8px 10px;
			border-radius: 999px;
			border: 1px solid var(--card-border);
			background: var(--panel-soft);
			color: var(--text);
			font: inherit;
		}

		.toolbar-meta,
		.toolbar-select {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			color: var(--muted);
			font-size: 13px;
			min-height: 38px;
			padding-right: 24px;
			margin-right: 12px;
			border-right: 1px solid rgba(255, 255, 255, 0.22);
		}

		.toolbar-select {
			padding-right: 0;
			margin-right: 0;
			border-right: 0;
		}

		.toolbar-meta strong {
			color: var(--text);
		}

		.toolbar-select select {
			font: inherit;
			color: var(--text);
			background: #2f2f2f;
			padding: 0;
		}

		.pill {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 8px 12px;
			border-radius: 999px;
			background: var(--panel-soft);
			color: var(--muted);
			font-size: 13px;
			border: 1px solid var(--card-border);
		}

		.pill strong {
			color: var(--text);
		}

		.pill.timer-state strong {
			font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
			font-variant-numeric: tabular-nums;
		}

		a.pill {
			color: var(--accent);
			text-decoration: none;
			border-color: rgba(127, 179, 255, 0.35);
		}

		a.pill::after {
			content: ' ↗';
			font-size: 12px;
			line-height: 1;
		}

		a.pill:hover {
			border-color: var(--accent);
			background: rgba(127, 179, 255, 0.1);
		}

		button.pill {
			appearance: none;
			cursor: pointer;
			font: inherit;
			font-size: 14px;
			color: var(--text);
		}

		button.pill:hover:not(:disabled) {
			border-color: var(--accent);
			background: rgba(127, 179, 255, 0.1);
		}

		button.pill:disabled {
			opacity: 0.6;
			cursor: progress;
		}

		.dot {
			width: 10px;
			height: 10px;
			border-radius: 999px;
			background: #5f6b76;
		}

		.dot.live {
			background: var(--positive);
			box-shadow: none;
		}

		.cards {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
			gap: 18px;
		}

		.card {
			position: relative;
			display: flex;
			flex-direction: column;
			gap: 14px;
			border-radius: 10px;
			border: 1px solid var(--card-border);
			background: var(--card);
			box-shadow: var(--shadow);
			padding: 16px;
		}

		.card.eliminated {
			opacity: 0.6;
		}

		.card::before {
			display: none;
		}

		.card-header {
			display: flex;
			align-items: center;
			gap: 14px;
		}

		.identity {
			min-width: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
		}

		.username {
			margin: 0;
			font-size: 1.3vw;
			line-height: 1.15;
			word-break: break-word;
		}

		.card.eliminated .username {
			text-decoration: line-through;
			text-decoration-thickness: 1.5px;
		}

		.country {
			margin-top: 6px;
			color: var(--muted);
			font-size: 13px;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		.stats {
			display: grid;
			gap: 10px;
		}

		.stats-row {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 12px;
			align-items: end;
		}

		.stat {
			display: grid;
			gap: 4px;
		}

		.toggle {
			display: flex;
			align-items: center;
			gap: 8px;
			justify-self: start;
			color: var(--muted);
			font-size: 11px;
			letter-spacing: 0.08em;
			line-height: 1.2;
			text-transform: uppercase;
		}

		.toggle input {
			margin: 0;
			width: 16px;
			height: 16px;
			accent-color: var(--accent);
		}

		.label {
			display: block;
			margin-bottom: 5px;
			color: var(--muted);
			font-size: 11px;
			letter-spacing: 0.11em;
			text-transform: uppercase;
		}

		.value {
			display: block;
			font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
			font-size: 14px;
			line-height: 1.1;
			font-variant-numeric: tabular-nums;
		}

		.value.positive {
			color: var(--positive);
		}

		.value.negative {
			color: var(--negative);
		}

		.empty {
			padding: 28px;
			border: 1px dashed var(--card-border);
			border-radius: 16px;
			text-align: center;
			color: var(--muted);
			background: var(--panel);
		}

		@media (max-width: 640px) {
			.shell {
				width: min(100vw - 20px, 1200px);
				padding-top: 20px;
			}

			.toolbar {
				padding: 12px;
			}

			.toolbar-meta,
			.toolbar-select {
				padding-right: 0;
				margin-right: 0;
				border-right: 0;
			}

			.toolbar-links {
				margin-left: 0;
				width: 100%;
			}

			.stats-row {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>

<body>
	<main class="shell">
		<section class="toolbar">
			<div class="toolbar-meta"><span id="status-dot" class="dot"></span><strong
					id="status-text">Connecting</strong>
			</div>
			<div class="toolbar-meta">Updated <strong id="updated-at">never</strong></div>
			<label class="toolbar-select" for="competition-select">Competition
				<select id="competition-select"></select>
			</label>
			<div class="pill timer-state">Competition timer <strong id="competition-timer-state">30:00</strong></div>
			<div class="toolbar-actions">
				<div class="toolbar-action-group">
					<label for="replay-duration-seconds">Replay seconds
						<input id="replay-duration-seconds" type="number" min="5" max="600" step="1" value="60">
					</label>
					<button id="start-replay" class="pill" type="button">Replay chart</button>
					<button id="stop-replay" class="pill" type="button">Stop chart replay</button>
				</div>
				<div class="toolbar-action-group">
					<button id="eliminate-bottom-half" class="pill" type="button">Eliminate bottom half</button>
					<button id="reset-eliminations" class="pill" type="button">Reset eliminations</button>
				</div>
			</div>
			<div class="toolbar-actions">
				<div class="toolbar-action-group">
					<button id="start-simulation" class="pill" type="button">Start simulation</button>
					<button id="stop-simulation" class="pill" type="button">Stop simulation</button>
				</div>
				<div class="toolbar-action-group">
					<label for="custom-timer-minutes">Custom timer minutes
						<input id="custom-timer-minutes" type="number" min="1" max="600" step="1" value="30">
					</label>
					<div class="pill timer-state"><strong id="custom-timer-state">30:00</strong></div>
					<button id="reset-custom-timer" class="pill" type="button">Reset custom timer</button>
					<button id="start-custom-timer" class="pill" type="button">Start custom timer countdown</button>
				</div>
				<div class="toolbar-action-group">
					<button id="reconnect-external" class="pill" type="button">Reconnect websocket</button>
					<button id="spawn-fake-trade" class="pill" type="button">Spawn fake trade</button>
				</div>
			</div>
			<div class="toolbar-links">
				<a class="pill" href="http://localhost:5050/index.html?overlay=standings" target="_blank"
					rel="noreferrer">Leaderboard</a>
				<a class="pill" href="http://localhost:5050/index.html?overlay=top_bar" target="_blank"
					rel="noreferrer">Top bar</a>
				<a class="pill" href="http://localhost:5050/index.html?overlay=top_bar&simple=true" target="_blank"
					rel="noreferrer">Simple top bar</a>
				<a class="pill" href="http://localhost:5050/index.html?overlay=recent_trades" target="_blank"
					rel="noreferrer">Recent trades</a>
				<a class="pill" href="http://localhost:5050/index.html?overlay=recent_trades&popup_trades=true"
					target="_blank" rel="noreferrer">Popup trades</a>
				<a class="pill" href="http://localhost:5050/pnl-chart" target="_blank" rel="noreferrer">PnL chart</a>
			</div>
		</section>

		<section id="cards" class="cards" aria-live="polite"></section>
	</main>

	<script>
		const cardsEl = document.getElementById('cards')
		const statusDotEl = document.getElementById('status-dot')
		const statusTextEl = document.getElementById('status-text')
		const updatedAtEl = document.getElementById('updated-at')
		const competitionSelectEl = document.getElementById('competition-select')
		const competitionTimerStateEl = document.getElementById('competition-timer-state')
		const reconnectExternalButtonEl = document.getElementById('reconnect-external')
		const customTimerMinutesEl = document.getElementById('custom-timer-minutes')
		const customTimerStateEl = document.getElementById('custom-timer-state')
		const resetCustomTimerButtonEl = document.getElementById('reset-custom-timer')
		const startCustomTimerButtonEl = document.getElementById('start-custom-timer')
		const replayDurationSecondsEl = document.getElementById('replay-duration-seconds')
		const startReplayButtonEl = document.getElementById('start-replay')
		const stopReplayButtonEl = document.getElementById('stop-replay')
		const startSimulationButtonEl = document.getElementById('start-simulation')
		const stopSimulationButtonEl = document.getElementById('stop-simulation')
		const spawnFakeTradeButtonEl = document.getElementById('spawn-fake-trade')
		const eliminateBottomHalfButtonEl = document.getElementById('eliminate-bottom-half')
		const resetEliminationsButtonEl = document.getElementById('reset-eliminations')
		const cardElements = new Map()
		const pendingEliminationUpdates = new Set()
		let emptyStateEl = null
		let selectedCompetitionId = null
		let competitionsLoaded = false
		let competitionSelectionPending = false
		let reconnectExternalPending = false
		let startReplayPending = false
		let stopReplayPending = false
		let startSimulationPending = false
		let stopSimulationPending = false
		let resetCustomTimerPending = false
		let startCustomTimerPending = false
		let spawnFakeTradePending = false
		let eliminateBottomHalfPending = false
		let resetEliminationsPending = false
		let competitionTimerDisplayValue = '30:00'

		async function refresh() {
			try {
				await refreshCompetitions()
				const response = await fetch('/debug/state', { cache: 'no-store' })
				if (!response.ok) {
					throw new Error(`HTTP ${response.status}`)
				}

				const nextState = await response.json()
				render(nextState)
			} catch (error) {
				renderError(error instanceof Error ? error.message : String(error))
			}
		}

		async function refreshCompetitions() {
			const response = await fetch('/admin/competitions', { cache: 'no-store' })
			if (!response.ok) {
				throw new Error(`HTTP ${response.status}`)
			}

			const payload = await response.json()
			selectedCompetitionId = typeof payload?.selectedCompetitionId === 'string' ? payload.selectedCompetitionId : null
			syncCompetitionOptions(Array.isArray(payload?.competitions) ? payload.competitions : [], selectedCompetitionId)
			competitionsLoaded = true
		}

		async function selectCompetitionAction(competitionId) {
			if (competitionSelectionPending) {
				competitionSelectEl.value = selectedCompetitionId ?? ''
				return
			}

			competitionSelectionPending = true
			competitionSelectEl.disabled = true

			try {
				const nextCompetitionId = competitionId.length === 0 ? null : competitionId
				const response = await fetch('/admin/competitions/select', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({ competition_id: nextCompetitionId }),
				})

				if (!response.ok) {
					throw new Error(`HTTP ${response.status}`)
				}

				selectedCompetitionId = nextCompetitionId
				await refresh()
			} catch (error) {
				competitionSelectEl.value = selectedCompetitionId ?? ''
				renderError(error instanceof Error ? error.message : String(error))
			} finally {
				competitionSelectionPending = false
				competitionSelectEl.disabled = false
			}
		}

		async function reconnectExternalFeed() {
			if (reconnectExternalPending) {
				return
			}

			reconnectExternalPending = true
			reconnectExternalButtonEl.disabled = true
			reconnectExternalButtonEl.textContent = 'Reconnecting...'

			try {
				const response = await fetch('/admin/external/reconnect', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
				})

				if (!response.ok) {
					throw new Error(`HTTP ${response.status}`)
				}

				await refresh()
			} catch (error) {
				renderError(error instanceof Error ? error.message : String(error))
			} finally {
				reconnectExternalPending = false
				reconnectExternalButtonEl.disabled = false
				reconnectExternalButtonEl.textContent = 'Clear graph'
			}
		}

		async function startSimulationAction() {
			if (startSimulationPending) {
				return
			}

			startSimulationPending = true
			startSimulationButtonEl.disabled = true
			startSimulationButtonEl.textContent = 'Starting...'

			try {
				const response = await fetch('/arena/simulate', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
				})

				if (!response.ok) {
					throw new Error(`HTTP ${response.status}`)
				}
			} catch (error) {
				renderError(error instanceof Error ? error.message : String(error))
			} finally {
				startSimulationPending = false
				startSimulationButtonEl.disabled = false
				startSimulationButtonEl.textContent = 'Start simulation'
			}
		}

		async function startReplayAction() {
			if (startReplayPending) {
				return
			}

			startReplayPending = true
			startReplayButtonEl.disabled = true
			startReplayButtonEl.textContent = 'Replaying...'

			try {
				const replayDurationSeconds = Number(replayDurationSecondsEl.value)
				const response = await fetch('/admin/pnl-chart/replay/start', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({ duration_seconds: replayDurationSeconds }),
				})

				if (!response.ok) {
					const payload = await response.json().catch(() => null)
					throw new Error(payload?.error ?? `HTTP ${response.status}`)
				}
			} catch (error) {
				renderError(error instanceof Error ? error.message : String(error))
			} finally {
				startReplayPending = false
				startReplayButtonEl.disabled = false
				startReplayButtonEl.textContent = 'Replay chart'
			}
		}

		async function stopReplayAction() {
			if (stopReplayPending) {
				return
			}

			stopReplayPending = true
			stopReplayButtonEl.disabled = true
			stopReplayButtonEl.textContent = 'Stopping replay...'

			try {
				const response = await fetch('/admin/pnl-chart/replay/stop', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
				})

				if (!response.ok) {
					throw new Error(`HTTP ${response.status}`)
				}
			} catch (error) {
				renderError(error instanceof Error ? error.message : String(error))
			} finally {
				stopReplayPending = false
				stopReplayButtonEl.disabled = false
				stopReplayButtonEl.textContent = 'Stop replay'
			}
		}

		async function stopSimulationAction() {
			if (stopSimulationPending) {
				return
			}

			stopSimulationPending = true
			stopSimulationButtonEl.disabled = true
			stopSimulationButtonEl.textContent = 'Stopping...'

			try {
				const response = await fetch('/arena/simulate/stop', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
				})

				if (!response.ok) {
					throw new Error(`HTTP ${response.status}`)
				}
			} catch (error) {
				renderError(error instanceof Error ? error.message : String(error))
			} finally {
				stopSimulationPending = false
				stopSimulationButtonEl.disabled = false
				stopSimulationButtonEl.textContent = 'Stop simulation'
			}
		}

		async function resetCustomTimerAction() {
			if (resetCustomTimerPending) {
				return
			}

			resetCustomTimerPending = true
			resetCustomTimerButtonEl.disabled = true
			resetCustomTimerButtonEl.textContent = 'Resetting...'

			try {
				const durationMinutes = Number(customTimerMinutesEl.value)
				const response = await fetch('/admin/custom-timer/reset', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({ duration_minutes: durationMinutes }),
				})

				if (!response.ok) {
					const payload = await response.json().catch(() => null)
					throw new Error(payload?.error ?? `HTTP ${response.status}`)
				}

				await refresh()
			} catch (error) {
				renderError(error instanceof Error ? error.message : String(error))
			} finally {
				resetCustomTimerPending = false
				resetCustomTimerButtonEl.disabled = false
				resetCustomTimerButtonEl.textContent = 'Reset custom timer'
			}
		}

		async function startCustomTimerAction() {
			if (startCustomTimerPending) {
				return
			}

			startCustomTimerPending = true
			startCustomTimerButtonEl.disabled = true
			startCustomTimerButtonEl.textContent = 'Starting...'

			try {
				const response = await fetch('/admin/custom-timer/start', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
				})

				if (!response.ok) {
					const payload = await response.json().catch(() => null)
					throw new Error(payload?.error ?? `HTTP ${response.status}`)
				}

				await refresh()
			} catch (error) {
				renderError(error instanceof Error ? error.message : String(error))
			} finally {
				startCustomTimerPending = false
				startCustomTimerButtonEl.disabled = false
				startCustomTimerButtonEl.textContent = 'Start custom timer'
			}
		}

		async function spawnFakeTradeAction() {
			if (spawnFakeTradePending) {
				return
			}

			spawnFakeTradePending = true
			spawnFakeTradeButtonEl.disabled = true
			spawnFakeTradeButtonEl.textContent = 'Spawning...'

			try {
				const response = await fetch('/admin/trades/spawn-fake', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
				})

				if (!response.ok) {
					throw new Error(`HTTP ${response.status}`)
				}
			} catch (error) {
				renderError(error instanceof Error ? error.message : String(error))
			} finally {
				spawnFakeTradePending = false
				spawnFakeTradeButtonEl.disabled = false
				spawnFakeTradeButtonEl.textContent = 'Spawn fake trade'
			}
		}

		async function eliminateBottomHalfAction() {
			if (eliminateBottomHalfPending) {
				return
			}

			eliminateBottomHalfPending = true
			eliminateBottomHalfButtonEl.disabled = true
			eliminateBottomHalfButtonEl.textContent = 'Eliminating...'

			try {
				const response = await fetch('/admin/leaderboard/eliminate-bottom-half', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
				})

				if (!response.ok) {
					throw new Error(`HTTP ${response.status}`)
				}

				await refresh()
			} catch (error) {
				renderError(error instanceof Error ? error.message : String(error))
			} finally {
				eliminateBottomHalfPending = false
				eliminateBottomHalfButtonEl.disabled = false
				eliminateBottomHalfButtonEl.textContent = 'Eliminate bottom half'
			}
		}

		async function resetEliminationsAction() {
			if (resetEliminationsPending) {
				return
			}

			resetEliminationsPending = true
			resetEliminationsButtonEl.disabled = true
			resetEliminationsButtonEl.textContent = 'Resetting...'

			try {
				const response = await fetch('/admin/leaderboard/reset-eliminations', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
				})

				if (!response.ok) {
					throw new Error(`HTTP ${response.status}`)
				}

				await refresh()
			} catch (error) {
				renderError(error instanceof Error ? error.message : String(error))
			} finally {
				resetEliminationsPending = false
				resetEliminationsButtonEl.disabled = false
				resetEliminationsButtonEl.textContent = 'Reset eliminations'
			}
		}

		function render(nextState) {
			const status = nextState?.connection?.status ?? 'disconnected'
			selectedCompetitionId = typeof nextState?.selectedCompetitionId === 'string'
				? nextState.selectedCompetitionId
				: selectedCompetitionId
			const availableCompetitions = Array.isArray(nextState?.availableCompetitions) ? nextState.availableCompetitions : []
			const customTimer = nextState?.customTimer ?? null
			const competitionTimer = nextState?.selectedCompetitionTimerWindow ?? null
			const updatedAt = nextState?.competition?.leaderboard?.ts ?? nextState?.connection?.updatedAt ?? null
			const traders = Array.isArray(nextState?.competition?.leaderboard?.traders)
				? nextState.competition.leaderboard.traders
				: []
			syncCompetitionOptions(availableCompetitions, selectedCompetitionId)
			syncCompetitionActionAvailability(Boolean(selectedCompetitionId))
			syncCompetitionTimerState(competitionTimer)
			syncCustomTimerControls(customTimer)

			statusDotEl.classList.toggle('live', status === 'connected')
			statusTextEl.textContent = status
			updatedAtEl.textContent = formatTimestamp(updatedAt)

			if (traders.length === 0) {
				renderEmptyState('No leaderboard snapshot has been stored yet.')
				return
			}

			clearEmptyState()
			syncCards(traders)
		}

		function renderError(message) {
			statusDotEl.classList.remove('live')
			statusTextEl.textContent = 'error'
			updatedAtEl.textContent = 'unavailable'
			renderEmptyState(`Failed to load state: ${message}`)
		}

		function syncCompetitionOptions(competitions, selectedId) {
			const nextOptions = [{ competition_id: '', name: competitionsLoaded ? 'No selection' : 'Loading competitions...' }, ...competitions]
			if (selectedId !== null && !competitions.some((competition) => competition.competition_id === selectedId)) {
				nextOptions.splice(1, 0, {
					competition_id: selectedId,
					name: `${selectedId} (ended)`,
				})
			}
			competitionSelectEl.replaceChildren()

			for (const competition of nextOptions) {
				const option = document.createElement('option')
				option.value = competition.competition_id ?? ''
				if (!competition.competition_id) {
					option.textContent = competition.name
				} else {
					option.textContent = `${competition.name} (${competition.competition_id})`
				}
				competitionSelectEl.append(option)
			}

			competitionSelectEl.value = selectedId ?? ''
			competitionSelectEl.disabled = competitionSelectionPending || !competitionsLoaded
		}

		function syncCompetitionActionAvailability(hasSelection) {
			replayDurationSecondsEl.disabled = !hasSelection || startReplayPending || stopReplayPending
			startReplayButtonEl.disabled = !hasSelection || startReplayPending
			stopReplayButtonEl.disabled = !hasSelection || stopReplayPending
			startSimulationButtonEl.disabled = startSimulationPending
			stopSimulationButtonEl.disabled = !hasSelection || stopSimulationPending
			spawnFakeTradeButtonEl.disabled = !hasSelection || spawnFakeTradePending
			eliminateBottomHalfButtonEl.disabled = !hasSelection || eliminateBottomHalfPending
			resetEliminationsButtonEl.disabled = !hasSelection || resetEliminationsPending
		}

		function syncCustomTimerControls(customTimer) {
			const durationMinutes = Number(customTimer?.durationMinutes)
			const isRunning = Boolean(customTimer?.isRunning)
			const remainingMs = Number(customTimer?.remainingMs)

			if (Number.isFinite(durationMinutes) && document.activeElement !== customTimerMinutesEl && !resetCustomTimerPending) {
				customTimerMinutesEl.value = String(durationMinutes)
			}

			customTimerStateEl.textContent = formatTimerValue(Number.isFinite(remainingMs) ? remainingMs : 0)

			customTimerMinutesEl.disabled = resetCustomTimerPending
			resetCustomTimerButtonEl.disabled = resetCustomTimerPending
			startCustomTimerButtonEl.disabled = startCustomTimerPending || isRunning
			if (isRunning && !startCustomTimerPending) {
				startCustomTimerButtonEl.textContent = 'Running...'
			} else if (!startCustomTimerPending) {
				startCustomTimerButtonEl.textContent = 'Start custom timer'
			}
		}

		function syncCompetitionTimerState(timerWindow) {
			const startedAt = Number(timerWindow?.startedAt)
			const endsAt = Number(timerWindow?.endsAt)
			const hasObservedValidWindow = Boolean(timerWindow?.hasObservedValidWindow)

			if (Number.isFinite(startedAt) && Number.isFinite(endsAt)) {
				competitionTimerDisplayValue = formatTimerValue(Math.max(endsAt - Date.now(), 0))
			} else if (!hasObservedValidWindow) {
				competitionTimerDisplayValue = '30:00'
			}

			competitionTimerStateEl.textContent = competitionTimerDisplayValue
		}

		function syncCards(traders) {
			const activeIds = new Set(traders.map((trader) => trader.user_id))

			for (const [userId, elements] of cardElements.entries()) {
				if (activeIds.has(userId)) continue
				elements.root.remove()
				cardElements.delete(userId)
			}

			for (let index = 0; index < traders.length; index++) {
				const trader = traders[index]
				const elements = cardElements.get(trader.user_id) ?? createCard(trader, index)
				updateCard(elements, trader, traders.length)

				const currentChild = cardsEl.children[index]
				if (currentChild !== elements.root) {
					cardsEl.insertBefore(elements.root, currentChild ?? null)
				}
			}
		}

		function createCard(trader, index) {
			const root = document.createElement('article')
			root.className = 'card'
			root.style.animationDelay = `${index * 35}ms`

			const header = document.createElement('div')
			header.className = 'card-header'

			const identity = document.createElement('div')
			identity.className = 'identity'

			const username = document.createElement('h2')
			username.className = 'username'

			const country = document.createElement('div')
			country.className = 'country'

			identity.append(username, country)

			const eliminationToggle = createToggle(trader.user_id)
			header.append(identity)

			const stats = document.createElement('div')
			stats.className = 'stats'
			const pnlRow = document.createElement('div')
			pnlRow.className = 'stats-row'
			const rankRow = document.createElement('div')
			rankRow.className = 'stats-row'

			const pnlPctValue = createStat(pnlRow, 'PnL %')
			const pnlUsdValue = createStat(pnlRow, 'PnL USD')
			const rankValue = createStat(rankRow, 'Rank')
			rankRow.append(eliminationToggle.label)
			stats.append(pnlRow, rankRow)

			root.append(header, stats)
			cardsEl.append(root)

			const elements = {
				root,
				username,
				country,
				rankValue,
				pnlUsdValue,
				pnlPctValue,
				eliminationToggle: eliminationToggle.input,
			}

			cardElements.set(trader.user_id, elements)
			return elements
		}

		function createStat(container, labelText, extraClass = '') {
			const stat = document.createElement('div')
			stat.className = 'stat'

			const label = document.createElement('span')
			label.className = 'label'
			label.textContent = labelText

			const value = document.createElement('span')
			value.className = ['value', extraClass].filter(Boolean).join(' ')

			stat.append(label, value)
			container.append(stat)
			return value
		}

		function createToggle(userId) {
			const label = document.createElement('label')
			label.className = 'toggle'

			const input = document.createElement('input')
			input.type = 'checkbox'
			input.addEventListener('change', () => {
				void updateElimination(userId, input.checked, input)
			})

			const text = document.createElement('span')
			text.textContent = 'Eliminated?'

			label.append(input, text)
			return { label, input }
		}

		function updateCard(elements, trader, totalTraders) {
			elements.root.classList.toggle('eliminated', Boolean(trader.is_eliminated))
			elements.username.textContent = trader.username
			elements.country.textContent = trader.country_code
			setRankValue(elements.rankValue, trader.rank, totalTraders)
			elements.eliminationToggle.checked = Boolean(trader.is_eliminated)
			elements.eliminationToggle.disabled = pendingEliminationUpdates.has(trader.user_id)

			setValue(elements.pnlUsdValue, formatCurrency(trader.pnl_usd), valueClass(trader.pnl_usd))
			setValue(elements.pnlPctValue, formatPercent(trader.pnl_pct), valueClass(trader.pnl_pct))
		}

		async function updateElimination(userId, isEliminated, input) {
			pendingEliminationUpdates.add(userId)
			input.disabled = true

			try {
				const response = await fetch(`/admin/traders/${encodeURIComponent(userId)}/elimination`, {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({ is_eliminated: isEliminated }),
				})

				if (!response.ok) {
					throw new Error(`HTTP ${response.status}`)
				}

				await refresh()
			} catch (error) {
				input.checked = !isEliminated
				renderError(error instanceof Error ? error.message : String(error))
			} finally {
				pendingEliminationUpdates.delete(userId)
				input.disabled = false
			}
		}

		function setValue(element, text, extraClass = '') {
			element.textContent = text
			element.className = ['value', extraClass].filter(Boolean).join(' ')
			element.style.color = ''
		}

		function setRankValue(element, rank, totalTraders) {
			setValue(element, String(rank))

			const safeTotal = Math.max(Number(totalTraders) || 1, 1)
			const safeRank = Math.min(Math.max(Number(rank) || safeTotal, 1), safeTotal)
			const ratio = safeTotal === 1 ? 0 : (safeRank - 1) / (safeTotal - 1)
			const hue = 120 - (120 * ratio)
			element.style.color = `hsl(${hue} 70% 60%)`
		}

		function renderEmptyState(message) {
			for (const elements of cardElements.values()) {
				elements.root.remove()
			}
			cardElements.clear()

			if (emptyStateEl === null) {
				emptyStateEl = document.createElement('div')
				emptyStateEl.className = 'empty'
				cardsEl.append(emptyStateEl)
			}

			emptyStateEl.textContent = message
		}

		function clearEmptyState() {
			if (emptyStateEl === null) return

			emptyStateEl.remove()
			emptyStateEl = null
		}

		function valueClass(number) {
			if (number > 0) return 'positive'
			if (number < 0) return 'negative'
			return ''
		}

		function formatCurrency(number) {
			return new Intl.NumberFormat('en-US', {
				style: 'currency',
				currency: 'USD',
				maximumFractionDigits: 2,
			}).format(Number(number ?? 0))
		}

		function formatPercent(number) {
			return `${Number(number ?? 0).toFixed(2)}%`
		}

		function formatTimestamp(value) {
			if (value === null || value === undefined) {
				return 'never'
			}

			const date = new Date(typeof value === 'number' ? value : String(value))
			if (Number.isNaN(date.getTime())) {
				return String(value)
			}

			return date.toLocaleTimeString([], {
				hour: '2-digit',
				minute: '2-digit',
				second: '2-digit',
			})
		}

		function formatTimerValue(remainingMs) {
			const safeRemainingMs = Math.max(Number(remainingMs) || 0, 0)
			const totalSeconds = Math.floor(safeRemainingMs / 1000)
			const minutes = Math.floor(totalSeconds / 60)
			const seconds = totalSeconds % 60

			return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`
		}

		reconnectExternalButtonEl.addEventListener('click', () => {
			void reconnectExternalFeed()
		})

		startReplayButtonEl.addEventListener('click', () => {
			void startReplayAction()
		})

		stopReplayButtonEl.addEventListener('click', () => {
			void stopReplayAction()
		})

		competitionSelectEl.addEventListener('change', () => {
			const competitionId = competitionSelectEl.value
			if (competitionId === (selectedCompetitionId ?? '')) {
				competitionSelectEl.value = selectedCompetitionId ?? ''
				return
			}

			void selectCompetitionAction(competitionId)
		})

		startSimulationButtonEl.addEventListener('click', () => {
			void startSimulationAction()
		})

		stopSimulationButtonEl.addEventListener('click', () => {
			void stopSimulationAction()
		})

		resetCustomTimerButtonEl.addEventListener('click', () => {
			void resetCustomTimerAction()
		})

		startCustomTimerButtonEl.addEventListener('click', () => {
			void startCustomTimerAction()
		})

		spawnFakeTradeButtonEl.addEventListener('click', () => {
			void spawnFakeTradeAction()
		})

		eliminateBottomHalfButtonEl.addEventListener('click', () => {
			void eliminateBottomHalfAction()
		})

		resetEliminationsButtonEl.addEventListener('click', () => {
			void resetEliminationsAction()
		})

		refresh()
		setInterval(refresh, 1000)
	</script>
</body>

</html>
